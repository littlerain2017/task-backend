<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Writing Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #171512;
    --header: rgba(23, 21, 18, 0.82);
    --ink: #e9e2d3;
    --ink-soft: #cfc6b2;
    --muted: #8a8172;
    --gold: #d3b25c;
    --gold-bright: #e8cd85;
    --green: #7d9c6a;
    --red: #c96a5a;
    --line: rgba(233, 226, 211, 0.12);
    --gold-line: rgba(211, 178, 92, 0.18);
    --note: #7bb0c9;
    --note-soft: rgba(123, 176, 201, 0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Serif SC", "Songti SC", Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: background 0.4s;
  }
  ::selection { background: rgba(211, 178, 92, 0.28); }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: #2e2a24; border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ===== 吸顶栏 ===== */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    width: 100%;
    display: flex;
    justify-content: center;
    background: var(--header);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(211, 178, 92, 0.10);
  }
  .header-inner {
    width: 100%;
    max-width: 860px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 24px;
  }
  .wordmark {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 600;
    font-size: 19px;
    letter-spacing: 0.32em;
    color: var(--gold);
    white-space: nowrap;
  }
  .doc-box {
    display: flex;
    align-items: center;
    min-width: 0;
    max-width: 320px;
    flex: 1;
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid var(--line);
    border-radius: 8px;
    transition: border-color 0.2s;
    position: relative;
  }
  .doc-box:hover { border-color: rgba(211, 178, 92, 0.4); }
  #docSelect {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    background: transparent;
    color: var(--ink);
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 14.5px;
    padding: 8px 30px 8px 14px;
    text-overflow: ellipsis;
    white-space: nowrap;
    overflow: hidden;
    cursor: pointer;
  }
  #docSelect option { color: #000; }
  .doc-box::after {
    content: "▾";
    position: absolute;
    right: 12px;
    color: var(--muted);
    font-size: 10px;
    pointer-events: none;
  }
  .actions { display: flex; gap: 8px; margin-left: auto; }
  .btn {
    font-family: inherit;
    font-size: 13.5px;
    color: #beb5a2;
    background: transparent;
    border: 1px solid rgba(233, 226, 211, 0.14);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .btn:hover { color: var(--gold-bright); border-color: rgba(211, 178, 92, 0.45); }

  /* ===== 元信息条 ===== */
  .meta {
    width: 100%;
    max-width: 860px;
    padding: 20px 24px 0;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.02em;
    flex-wrap: wrap;
  }
  .meta b { color: var(--gold); font-weight: 500; }
  .dot-sep { opacity: 0.5; margin: 0 6px; }

  /* 实时字数：右上角悬浮胶囊（与右下角计时器同款） */
  .count-pill {
    position: fixed;
    top: 72px;
    right: 24px;
    z-index: 20;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--gold-line);
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .count-pill b { color: var(--gold); font-weight: 500; font-variant-numeric: tabular-nums; }
  .sync { display: flex; align-items: center; gap: 8px; }
  .sync-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    display: inline-block;
    transition: background 0.3s;
  }
  .sync-dot.ok { background: var(--green); }
  .sync-dot.busy { background: var(--gold); }
  .sync-dot.err { background: var(--red); }
  .sync .today { color: var(--gold); }
  #syncText.err { color: var(--red); }

  /* ===== 编辑器 ===== */
  #editor {
    width: 100%;
    max-width: var(--measure, 760px);
    padding: 48px var(--side, 7ch) 45vh;
    font-size: var(--font-size, 19px);
    line-height: var(--leading, 2.05);
    letter-spacing: var(--tracking, 0.05em);
    color: var(--ink);
    caret-color: var(--gold);
    outline: none;
    text-wrap: pretty;
    word-break: break-word;
  }
  #editor .line { margin: 0 0 var(--para-gap, 1.1em); text-indent: 0; transition: opacity 0.45s ease; }
  #editor .line.h1 {
    font-size: 1.35em;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-indent: 0;
    margin-bottom: 0.6em;
  }
  #editor .line.h2 {
    font-size: 1.12em;
    font-weight: 500;
    color: var(--ink-soft);
    text-indent: 0;
    margin-bottom: 1.2em;
  }
  #editor .line.rule {
    text-indent: 0;
    text-align: center;
    color: #55503f;
    letter-spacing: 0.5em;
    margin: 2.2em 0;
  }
  #editor .line.blank { margin: 0 0 var(--para-gap, 1.1em); text-indent: 0; }
  #editor.focus-on .line.dim { opacity: 0.28; }
  #editor[contenteditable="false"] { color: var(--muted); }

  /* 段落书签：鎏金左线 + 微金底 + 🔖 */
  #editor .line.marked {
    background: rgba(211, 178, 92, 0.07);
    border-left: 3px solid var(--gold);
    padding-left: 14px;
    margin-left: -17px;
    border-radius: 2px;
    position: relative;
  }
  #editor .line.marked::after {
    content: "🔖";
    position: absolute;
    right: -4px;
    top: 0;
    font-size: 0.7em;
    opacity: 0.7;
  }
  #editor.focus-on .line.marked.dim { opacity: 0.55; }  /* 专注模式下书签段落也别太暗 */

  /* 朋友的留言：编辑器内联、冷蓝色 */
  #editor .note {
    position: relative;
    margin: 6px 0 1.2em;
    padding: 8px 30px 8px 12px;
    border-left: 3px solid var(--note);
    background: var(--note-soft);
    border-radius: 0 8px 8px 0;
    text-indent: 0;
    font-size: 0.82em;
    line-height: 1.65;
  }
  #editor .note .in-head { color: var(--note); font-size: 0.85em; letter-spacing: 0.04em; }
  #editor .note .in-text { color: #cfe0e9; white-space: pre-wrap; margin-top: 3px; }
  #editor .note .in-del {
    position: absolute; right: 10px; top: 8px; color: var(--muted);
    cursor: pointer; font-size: 14px; line-height: 1;
  }
  #editor .note .in-del:hover { color: var(--note); }

  /* 作者自己的批注：鎏金，与朋友留言（冷蓝）区分开 */
  #editor .note.my-note {
    border-left-color: var(--gold);
    background: rgba(211, 178, 92, 0.08);
  }
  #editor .note.my-note .in-head { color: var(--gold); }
  #editor .note.my-note .in-text { color: var(--ink-soft); }
  #editor .note.my-note .in-del:hover { color: var(--gold-bright); }
  #editor .note.my-note .in-text {
    cursor: text;
    outline: none;
    min-height: 1.4em;
    border-radius: 3px;
  }
  #editor .note.my-note .in-text:focus {
    box-shadow: 0 0 0 2px var(--gold-line);
  }
  #editor .note.my-note .in-text:empty::before {
    content: "写点什么…";
    color: var(--muted);
  }

  /* 彩色高亮：选中文字上色，用于区分修改/待办等 */
  #editor .hl { border-radius: 2px; padding: 0 1px; }
  #editor .hl-red    { color: #e6897a; }
  #editor .hl-amber  { color: #e0a860; }
  #editor .hl-green  { color: #8fc99a; }
  #editor .hl-cyan   { color: #79c3c3; }
  #editor .hl-violet { color: #b6a0da; }

  #hlPalette {
    position: fixed; z-index: 40; display: none;
    align-items: center; gap: 8px; padding: 7px 10px;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--gold-line); border-radius: 999px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.5);
    transform: translate(-50%, -100%);
  }
  #hlPalette.open { display: flex; }
  #hlPalette .sw {
    width: 20px; height: 20px; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.25); transition: transform 0.12s;
  }
  #hlPalette .sw:hover { transform: scale(1.18); }
  #hlPalette .clr {
    font-family: inherit; font-size: 12px; color: var(--muted); cursor: pointer;
    background: transparent; border: none; padding: 0 2px 0 4px; border-left: 1px solid var(--line);
  }
  #hlPalette .clr:hover { color: var(--ink); }

  /* ===== 剧本模式（Final Draft 规范：Courier 12pt、55 行/页 ≈ 1 分钟） ===== */
  /* 颜色完全跟随当前色调，只改字体与版式 */
  #editor.script {
    position: relative;
    font-family: "Courier Prime", "Courier New", Courier, monospace;
    --sc-lh: 24px;
    font-size: 15px;
    line-height: var(--sc-lh);
    letter-spacing: 0;
    width: min(74ch, calc(100vw - 24px));
    max-width: none;
    padding: calc(var(--sc-lh) * 2) 0 45vh;   /* 横向留白由 .line 的 8ch 负责，不叠加 --side */
    text-wrap: initial;
  }
  /* 分页线：每 55 行一页（一页一分钟） */
  #editor.script::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: calc(var(--sc-lh) * 2);
    bottom: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent calc(var(--sc-lh) * 55 - 1px),
      var(--gold-line) calc(var(--sc-lh) * 55 - 1px),
      var(--gold-line) calc(var(--sc-lh) * 55)
    );
  }
  #editor.script .line {
    margin: 0;
    text-indent: 0;
    padding-left: 8ch;
    padding-right: 8ch;
  }
  /* 元素语义色：场景=鎏金 / 人名=灰绿 / 对白=正文色 / 括号注=灰 / 转场=雾紫 */
  #editor.script .line.sc-scene {
    text-transform: uppercase;
    font-weight: 700;
    color: var(--gold);
  }
  #editor.script .line.sc-char {
    padding-left: 28ch;
    text-transform: uppercase;
    color: #96bd9c;
  }
  #editor.script .line.sc-dial {
    padding-left: 18ch;
    padding-right: 20ch;
  }
  #editor.script .line.sc-paren {
    padding-left: 22ch;
    padding-right: 24ch;
    color: var(--muted);
    font-style: italic;
  }
  #editor.script .line.sc-trans {
    text-align: right;
    text-transform: uppercase;
    color: #a89bc9;
  }
  #editor.script .line.sc-action {
    color: var(--ink-soft);
  }

  .btn.on { color: var(--gold); border-color: rgba(211, 178, 92, 0.5); }

  /* 上一章 / 下一章 */
  .chap-nav {
    flex-shrink: 0;
    padding: 6px 11px;
    font-size: 17px;
    line-height: 1;
    letter-spacing: 0;
  }
  .chap-nav:disabled {
    opacity: 0.28;
    cursor: default;
    color: var(--muted);
    border-color: var(--line);
  }
  .chap-nav:disabled:hover { color: var(--muted); border-color: var(--line); }

  /* ===== 计时器胶囊 ===== */
  .timer {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--gold-line);
    border-radius: 999px;
    padding: 8px 10px 8px 16px;
  }
  .timer { padding: 8px 18px; }
  .timer .t-label {
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--muted);
    white-space: nowrap;
  }
  .timer .clock {
    font-size: 22px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    text-align: center;
    color: #beb5a2;
    transition: color 0.3s;
  }
  .timer .clock.running { color: var(--gold-bright); }

  /* 底部渐隐 */
  .fade {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    pointer-events: none;
    height: 90px;
    background: linear-gradient(to top, var(--bg), transparent);
    transition: background 0.4s;
  }

  /* ===== 设置面板 ===== */
  #prefs {
    position: fixed;
    top: 64px;
    right: 16px;
    z-index: 30;
    width: 250px;
    background: var(--header);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--gold-line);
    border-radius: 12px;
    padding: 18px;
    display: none;
    flex-direction: column;
    gap: 16px;
    font-size: 13px;
    color: var(--muted);
  }
  #prefs.open { display: flex; }
  #prefs .row { display: flex; flex-direction: column; gap: 8px; }
  #prefs .row-title { letter-spacing: 0.1em; font-size: 12px; }
  .tones { display: flex; gap: 8px; }
  .tone {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid var(--line);
    cursor: pointer;
  }
  .tone.active { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(211, 178, 92, 0.3); }
  #prefs input[type="range"] { width: 100%; accent-color: var(--gold); }
  .switch { display: flex; justify-content: space-between; align-items: center; color: var(--ink-soft); }

  /* ===== 书签总览面板 ===== */
  #marksPanel {
    position: fixed;
    top: 64px;
    right: 16px;
    z-index: 30;
    width: 320px;
    max-width: calc(100vw - 32px);
    max-height: 70vh;
    overflow-y: auto;
    background: var(--header);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--gold-line);
    border-radius: 12px;
    padding: 14px;
    display: none;
    flex-direction: column;
    gap: 4px;
    font-size: 13px;
  }
  #marksPanel.open { display: flex; }
  #marksPanel .mp-doc {
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--gold);
    padding: 10px 6px 4px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 4px;
  }
  #marksPanel .mp-item {
    display: flex;
    gap: 8px;
    align-items: baseline;
    padding: 7px 8px;
    border-radius: 8px;
    color: var(--ink-soft);
    cursor: pointer;
    line-height: 1.6;
  }
  #marksPanel .mp-item:hover { background: rgba(211, 178, 92, 0.10); color: var(--ink); }
  #marksPanel .mp-item .bk { font-size: 11px; flex-shrink: 0; }
  #marksPanel .mp-empty { color: var(--muted); text-align: center; padding: 24px 8px; line-height: 1.9; }

  /* ===== 科幻顾问面板 ===== */
  #advisorPanel {
    position: fixed;
    top: 64px;
    right: 16px;
    z-index: 31;
    width: 400px;
    max-width: calc(100vw - 32px);
    max-height: 76vh;
    background: var(--header);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--gold-line);
    border-radius: 12px;
    display: none;
    flex-direction: column;
    font-size: 13px;
  }
  #advisorPanel.open { display: flex; }
  #advisorPanel .ad-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  #advisorPanel .ad-title {
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--gold);
    flex: 1;
  }
  #advisorPanel .ad-x {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 2px 4px;
  }
  #advisorPanel .ad-x:hover { color: var(--ink); }
  #advisorPanel .ad-body { padding: 12px 14px; overflow-y: auto; flex: 1; }
  #advisorPanel textarea {
    width: 100%;
    box-sizing: border-box;
    min-height: 62px;
    resize: vertical;
    background: rgba(0, 0, 0, 0.22);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    padding: 9px 10px;
    font: inherit;
    line-height: 1.65;
    outline: none;
  }
  #advisorPanel textarea:focus { border-color: var(--gold-line); }
  #advisorPanel textarea::placeholder { color: var(--muted); }
  #advisorPanel .ad-row { display: flex; gap: 8px; margin-top: 10px; }
  #advisorPanel .ad-go {
    flex: 1;
    background: rgba(211, 178, 92, 0.14);
    border: 1px solid var(--gold-line);
    color: var(--gold-bright);
    border-radius: 8px;
    padding: 8px 10px;
    cursor: pointer;
    font: inherit;
    letter-spacing: 0.04em;
    transition: background 140ms ease;
  }
  #advisorPanel .ad-go:hover:not(:disabled) { background: rgba(211, 178, 92, 0.24); }
  #advisorPanel .ad-go:disabled { opacity: 0.45; cursor: default; }
  #advisorPanel .ad-hint {
    color: var(--muted);
    font-size: 11.5px;
    line-height: 1.75;
    margin-top: 9px;
  }
  #advisorPanel .ad-out {
    margin-top: 14px;
    padding-top: 13px;
    border-top: 1px solid var(--line);
    color: var(--ink-soft);
    line-height: 1.85;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #advisorPanel .ad-out:empty { display: none; }
  #advisorPanel .ad-out h3 {
    color: var(--gold);
    font-size: 12px;
    letter-spacing: 0.07em;
    margin: 15px 0 5px;
    font-weight: 600;
  }
  #advisorPanel .ad-out h3:first-child { margin-top: 0; }
  #advisorPanel .ad-out strong { color: var(--ink); font-weight: 600; }
  #advisorPanel .ad-err { color: var(--red); }
  #advisorPanel .ad-wait { color: var(--muted); font-style: italic; }

  /* ===== 书架（全屏入口） ===== */
  #shelfView {
    position: fixed;
    inset: 0;
    z-index: 25;
    background: #000;
    display: none;
    overflow: hidden;
  }
  #shelfView.open { display: block; }
  /* 底层：银河全景（ESO 360° panorama），压暗调灰做深空底 */
  #shelfBg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(0.85) brightness(0.42);
    transform: scale(1.06);
    transition: transform 0.3s ease-out;
  }
  /* 中层：Canvas 实时三维星点 */
  #starCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  /* 顶层：内容 */
  .shelf-content {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-y: auto;
    padding: 9vh 24px 12vh;
  }
  .shelf-title {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 600;
    font-size: clamp(26px, 5vw, 44px);
    letter-spacing: 0.38em;
    color: var(--gold);
    text-indent: 0.38em;
    text-align: center;
  }
  .shelf-sub {
    margin: 14px 0 7vh;
    font-size: 12px;
    letter-spacing: 0.26em;
    color: var(--faint, #5f5849);
    text-indent: 0.26em;
    font-variant-numeric: tabular-nums;
  }
  .shelf-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 26px;
    width: 100%;
    max-width: 900px;
  }
  /* 默认安静：只有一道发丝边与极淡的底。鎏金留给"在写"的那一本。
     去掉了原先的常驻浮动动画——六张卡一起飘像游戏菜单，不像写作工具。 */
  .book-card {
    position: relative;

</style>
</head>
<body>
  <div id="setup">
    <h1>WRITING MACHINE</h1>
    <p>粘贴小程序「连接电脑」页里的配对令牌。<br>这里编辑的是你电脑写作文件夹里的同一批文件，双向同步。</p>
    <input id="tokenInput" placeholder="WRT-XXXXXXXX" autocomplete="off">

    <div class="header-inner">

        <button class="btn" onclick="copyDoc()">复制</button>

        <button class="btn" onclick="shareBook()" title="把这本书只读分享给朋友，可留言">分享</button>
        <button class="btn" onclick="editToken()">令牌</button>

  <!-- 今日新增：右上角常驻（与小程序大数字同源） -->
  <div class="count-pill">

  </div>

  <div class="meta">
    <div>中文 <b id="cjkCount">0</b> 字 <span class="dot-sep">·</span> 英文 <b id="enCount">0</b> 词<span id="pageInfo" style="display:none"><span class="dot-sep">·</span>约 <b id="pageCount">1</b> 页 / <b id="minCount">1</b> 分钟</span></div>

  <div id="shelfView">
    <img id="shelfBg" src="/writing/shelf-bg.jpg" alt="">

      <div class="shelf-title">WRITING MACHINE</div>
      <div class="shelf-sub" id="shelfSub"></div>

  <div id="prefs">
    <div class="row">
      <span class="row-title">色调</span>
      <div class="tones" id="toneRow"></div>
    </div>
    <div class="row">
      <span class="row-title">字号 <span id="fontSizeVal">19</span>px</span>
      <input type="range" min="16" max="24" step="1" id="fontSizeRange" oninput="setPref('fontSize', +this.value)">
    </div>
    <div class="row">
      <span class="row-title">行宽 <span id="measureVal">760</span>px</span>
      <input type="range" min="600" max="960" step="20" id="measureRange" oninput="setPref('measure', +this.value)">
    </div>
    <div class="row">
      <span class="row-title">字距 <span id="trackingVal">0.05</span>em</span>
      <input type="range" min="0" max="0.12" step="0.01" id="trackingRange" oninput="setPref('tracking', +this.value)">
    </div>
    <div class="row">
      <span class="row-title">行距 <span id="leadingVal">2.05</span></span>
      <input type="range" min="1.4" max="2.6" step="0.05" id="leadingRange" oninput="setPref('leading', +this.value)">
    </div>
    <div class="row">
      <span class="row-title">段距 <span id="paraGapVal">1.10</span>em</span>
      <input type="range" min="0" max="2.4" step="0.1" id="paraGapRange" oninput="setPref('paraGap', +this.value)">
    </div>
    <div class="row">
      <span class="row-title">两侧留白 <span id="sideVal">7</span>ch</span>
      <input type="range" min="0" max="14" step="1" id="sideRange" oninput="setPref('side', +this.value)">
    </div>
    <div class="switch">
      <span>专注模式</span>
      <input type="checkbox" id="focusToggle" onchange="setPref('focus', this.checked)" style="accent-color: var(--gold);">
    </div>
  </div>

<script>
const CJK_RE = /[一-鿿]/g;
const EN_RE = /[A-Za-z]+(?:'[A-Za-z]+)?/g;
const SAVE_DEBOUNCE_MS = 4000;
const REFRESH_MS = 20000;
const TYPING_IDLE_MS = 5000;  // 停笔 5 秒计时即暂停（句内停顿不断流）

const TONES = {
  "暖黑":   { bg: "#171512", header: "rgba(23,21,18,0.82)",  ink: "#e9e2d3" },
  "纯黑":   { bg: "#0d0c0b", header: "rgba(13,12,11,0.82)",  ink: "#e6e1d6" },
  "墨绿":   { bg: "#141a16", header: "rgba(20,26,22,0.82)",  ink: "#e4e6d9" },
  "藏蓝":   { bg: "#13161d", header: "rgba(19,22,29,0.82)",  ink: "#e2e4e6" },
  "咖啡褐": { bg: "#1b1512", header: "rgba(27,21,18,0.82)",  ink: "#ecdfd0" },
};

let token = localStorage.getItem("writing_token") || "";
let docList = [];
let current = null;
let dirty = false;
let saveTimer = null;
let serverActiveMs = 0;
let pendingActiveMs = Number(localStorage.getItem("writing_pending_active") || 0);
let lastKeyTs = 0;
let prefs = Object.assign(
  { tone: "暖黑", fontSize: 19, measure: 760, tracking: 0.05,
    leading: 2.05, paraGap: 1.1, side: 7, focus: true },
  JSON.parse(localStorage.getItem("writing_prefs") || "{}")
);

const $ = (id) => document.getElementById(id);
const editor = $("editor");

/* ===== 阅读舒适度 ===== */
function applyPrefs() {
  const t = TONES[prefs.tone] || TONES["暖黑"];
  const r = document.documentElement.style;
  r.setProperty("--bg", t.bg);
  r.setProperty("--header", t.header);
  r.setProperty("--ink", t.ink);
  r.setProperty("--font-size", prefs.fontSize + "px");
  r.setProperty("--measure", prefs.measure + "px");
  r.setProperty("--tracking", prefs.tracking + "em");
  r.setProperty("--leading", prefs.leading);
  r.setProperty("--para-gap", prefs.paraGap + "em");
  r.setProperty("--side", prefs.side + "ch");
  editor.classList.toggle("focus-on", prefs.focus);
  if (!prefs.focus) editor.querySelectorAll(".line.dim").forEach((n) => n.classList.remove("dim"));
  $("fontSizeVal").textContent = prefs.fontSize;
  $("measureVal").textContent = prefs.measure;
  $("trackingVal").textContent = prefs.tracking.toFixed(2);
  $("leadingVal").textContent = prefs.leading.toFixed(2);
  $("paraGapVal").textContent = prefs.paraGap.toFixed(2);
  $("sideVal").textContent = prefs.side;
  $("fontSizeRange").value = prefs.fontSize;
  $("measureRange").value = prefs.measure;
  $("trackingRange").value = prefs.tracking;
  $("leadingRange").value = prefs.leading;
  $("paraGapRange").value = prefs.paraGap;
  $("sideRange").value = prefs.side;
  $("focusToggle").checked = prefs.focus;
  document.querySelectorAll(".tone").forEach((el) =>
    el.classList.toggle("active", el.dataset.tone === prefs.tone));
}

function setPref(key, val) {
  prefs[key] = val;
  localStorage.setItem("writing_prefs", JSON.stringify(prefs));
  applyPrefs();
}

function togglePrefs() { $("prefs").classList.toggle("open"); }

// ⌘D（Windows 上 Ctrl+D）呼出/收起调整面板；⌘S 回到上次修改的地方并立即保存
document.addEventListener("keydown", (e) => {
  if (!(e.metaKey || e.ctrlKey) || e.altKey) return;
  const key = e.key.toLowerCase();
  if (key === "d" && !e.shiftKey) {
    e.preventDefault();  // 拦截浏览器默认的“添加书签”
    togglePrefs();
  } else if (key === "s") {  // ⌘S 或 ⌘⇧S 都可以
    e.preventDefault();  // 拦截浏览器默认的“保存网页”
    jumpToLastEdit();
    if (dirty) save();
  } else if (key === "m") {
    e.preventDefault();
    if (e.shiftKey) jumpNextMark();  // ⌘⇧M 在书签间跳转
    else toggleMark();               // ⌘M 标记/取消当前段落
  } else if (e.code === "Slash" && !e.shiftKey) {
    // ⌘/ 加批注。原本用 ⌘⇧N，但 macOS 上 Chrome/Safari 都拿它开无痕窗口，
    // 浏览器级快捷键在页面收到 keydown 之前就被吃掉，preventDefault 拦不住。
    e.preventDefault();
    addNote();
  } else if (e.shiftKey && (e.code === "Comma" || e.code === "Period")) {
    // ⌘⇧< / ⌘⇧> 翻章。用 code 而非 key，不受键盘布局影响；
    // 不用方向键是因为 ⌘←/→ 在正文里是移动光标，写作时会打架。
    e.preventDefault();
    gotoSibling(e.code === "Comma" ? -1 : 1);
  }
});

/* ===== 段落书签 ===== */
function caretBlock() {
  const sel = document.getSelection();
  if (!sel || !sel.anchorNode || !editor.contains(sel.anchorNode)) return null;
  let n = sel.anchorNode;
  while (n && n.parentNode !== editor) n = n.parentNode;
  return n && n.nodeType === Node.ELEMENT_NODE ? n : null;
}

function applyMarks() {
  if (!current) return;
  const marks = new Set(current.marks || []);
  editor.childNodes.forEach((node) => {
    if (node.nodeType !== Node.ELEMENT_NODE || isNote(node)) return;
    const text = node.textContent.trim();
    node.classList.toggle("marked", text !== "" && marks.has(text));
  });
}

function toggleMark() {
  if (!current) return;
  const block = caretBlock();
  const text = block ? block.textContent.trim() : "";
  if (!text) {
    setSync("先把光标放到要标记的段落里", "");
    return;
  }
  const marks = new Set(current.marks || []);
  if (marks.has(text)) {
    marks.delete(text);
    setSync("已取消标记", "ok");
  } else {
    marks.add(text);
    setSync("已标记 🔖（⌘⇧M 可跳转回来）", "ok");
  }
  current.marks = Array.from(marks);
  const meta = docList.find((d) => d.name === current.name);
  if (meta) meta.marks = current.marks;  // 书签面板保持最新
  applyMarks();
  api("/writing/docs/marks", { name: current.name, marks: current.marks })
    .catch(() => setSync("书签保存失败，稍后自动重试", "err"));
}

/* ===== 书签总览面板 ===== */
async function toggleMarksPanel() {
  const panel = $("marksPanel");
  if (panel.classList.contains("open")) {
    panel.classList.remove("open");
    return;
  }
  try { await loadList(); } catch (e) { /* 用缓存的 docList 也能渲染 */ }
  renderMarksPanel();
  panel.classList.add("open");
}

function renderMarksPanel() {
  const panel = $("marksPanel");
  panel.innerHTML = "";
  let total = 0;
  docList.forEach((d) => {
    const marks = d.marks || [];
    if (marks.length === 0) return;
    total += marks.length;
    const head = document.createElement("div");
    head.className = "mp-doc";
    head.textContent = d.name;
    panel.appendChild(head);
    marks.forEach((text) => {
      const item = document.createElement("div");
      item.className = "mp-item";
      const bk = document.createElement("span");
      bk.className = "bk";
      bk.textContent = "🔖";
      const span = document.createElement("span");
      span.textContent = text.length > 42 ? text.slice(0, 42) + "…" : text;
      item.appendChild(bk);
      item.appendChild(span);
      item.onclick = () => gotoMark(d.name, text);
      panel.appendChild(item);
    });
  });
  if (total === 0) {
    const empty = document.createElement("div");
    empty.className = "mp-empty";
    empty.textContent = "还没有书签。光标放进段落里按 ⌘M（或点「标记」）就能收藏在这里。";
    panel.appendChild(empty);
  }
}

async function gotoMark(name, text) {
  $("marksPanel").classList.remove("open");
  if (!current || current.name !== name) await openDoc(name);
  const target = Array.prototype.find.call(
    editor.childNodes,
    (n) => n.nodeType === Node.ELEMENT_NODE && n.textContent.trim() === text
  );
  if (!target) {
    setSync("该书签对应的段落已被修改或删除", "");
    return;
  }
  editor.focus();
  const sel = document.getSelection();
  const range = document.createRange();
  range.setStart(target, 0);
  range.collapse(true);
  sel.removeAllRanges();
  sel.addRange(range);
  target.scrollIntoView({ behavior: "smooth", block: "center" });
}

function jumpNextMark() {
  const marked = Array.from(editor.querySelectorAll(".line.marked"));
  if (marked.length === 0) {
    setSync("还没有书签（光标放段落里按 ⌘M 标记）", "");
    return;
  }
  const cur = caretBlock();
  const curIdx = cur ? marked.indexOf(cur) : -1;
  const target = marked[(curIdx + 1) % marked.length];
  editor.focus();
  const sel = document.getSelection();
  const range = document.createRange();
  range.setStart(target, 0);
  range.collapse(true);
  sel.removeAllRanges();
  sel.addRange(range);
  target.scrollIntoView({ behavior: "smooth", block: "center" });
  setSync(`书签 ${marked.indexOf(target) + 1} / ${marked.length}`, "ok");
}

/* ===== 记住并跳回上次修改的位置 ===== */
let lastEditPos = JSON.parse(localStorage.getItem("writing_lastedit") || "{}");

function rememberEditPos() {
  const sel = document.getSelection();
  if (!current || !sel || !sel.anchorNode || !editor.contains(sel.anchorNode)) return;
  let block = sel.anchorNode;
  while (block && block.parentNode !== editor) block = block.parentNode;
  if (!block) return;
  const lineIndex = Array.prototype.indexOf.call(editor.childNodes, block);
  const range = document.createRange();
  range.setStart(block, 0);
  range.setEnd(sel.anchorNode, sel.anchorOffset);
  lastEditPos[current.name] = { line: lineIndex, offset: range.toString().length };
  localStorage.setItem("writing_lastedit", JSON.stringify(lastEditPos));
}

function lastNonEmptyIndex() {
  for (let i = editor.childNodes.length - 1; i >= 0; i--) {
    if (editor.childNodes[i].textContent.trim() !== "") return i;
  }
  return editor.childNodes.length - 1;
}

function jumpToLastEdit() {
  if (!current || editor.childNodes.length === 0) return;
  let pos = lastEditPos[current.name];
  if (!pos) {
    // 本文件还没有记录过落笔位置 → 跳到全文末尾
    const i = lastNonEmptyIndex();
    pos = { line: i, offset: editor.childNodes[i].textContent.length };
    setSync("跳到全文末尾（打字后 ⌘S 会记住确切位置）", "ok");
  } else {
    setSync("已回到上次落笔处", "ok");
  }
  const block = editor.childNodes[Math.min(pos.line, editor.childNodes.length - 1)];
  if (!block) return;
  // 在块内按字符偏移找到落点
  let remaining = pos.offset;
  let target = block, targetOffset = 0;
  const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
  let node;
  while ((node = walker.nextNode())) {
    if (remaining <= node.textContent.length) {
      target = node;
      targetOffset = remaining;
      break;
    }
    remaining -= node.textContent.length;
  }
  editor.focus();
  const sel = document.getSelection();
  const range = document.createRange();
  try {
    range.setStart(target, targetOffset);
  } catch (e) {
    range.setStart(block, 0);
  }
  range.collapse(true);
  sel.removeAllRanges();
  sel.addRange(range);
  (block.scrollIntoView ? block : editor).scrollIntoView({ behavior: "smooth", block: "center" });
}

  if (!$("marksPanel").contains(e.target) && !e.target.closest(".actions")) $("marksPanel").classList.remove("open");
});

/* ===== 剧本模式（Final Draft 元素识别） ===== */
const LINES_PER_PAGE = 55;  // 一页一分钟
const SCENE_RE = /^(INT|EXT|EST|I\/E|INT\/EXT)[.\s]|^(内景|外景|内[.．·]|外[.．·])/i;
const TRANS_RE = /^>|TO:\s*$|^(FADE (IN|OUT)|CUT TO|DISSOLVE)|(切至|转场|淡入|淡出)[:：]?\s*$/i;
const CHAR_LATIN_RE = /^[A-Z][A-Z0-9 .'\-()]{0,31}$/;
const PAREN_RE = /^[(（]/;
const SENTENCE_END_RE = /[。！？…，,.;；、!?]$/;
const HAS_CJK_RE = /[一-鿿]/;

let scriptModes = JSON.parse(localStorage.getItem("writing_script_modes") || "{}");

function isScriptMode() {
  if (!current) return false;
  if (current.name in scriptModes) return scriptModes[current.name];
  return /剧本|screenplay|script|scene|\.fountain$/i.test(current.name);  // 按文件名自动开启
}

function toggleScriptMode() {
  if (!current) return;
  scriptModes[current.name] = !isScriptMode();
  localStorage.setItem("writing_script_modes", JSON.stringify(scriptModes));
  applyMode();
  reclassify();
  applyMarks();      // reclassify 会覆写 className，marked 类要重新贴回来
  renderCounts();
}

function applyMode() {
  const on = isScriptMode();
  editor.classList.toggle("script", on);
  $("modeBtn").classList.toggle("on", on);
  $("pageInfo").style.display = on ? "" : "none";
}

/** 剧本元素识别：整篇有状态扫描（对白依赖前一行是角色） */
function classifyScriptLines(lines) {
  const types = [];
  for (let i = 0; i < lines.length; i++) {
    const t = lines[i].trim();
    const prev = i > 0 ? types[i - 1] : "blank";
    const next = i + 1 < lines.length ? lines[i + 1].trim() : "";
    let type;
    if (t === "") type = "blank";
    else if (SCENE_RE.test(t)) type = "scene";
    else if (TRANS_RE.test(t)) type = "trans";
    else if (PAREN_RE.test(t) && (prev === "char" || prev === "dial" || prev === "paren")) type = "paren";
    else if (prev === "char" || prev === "paren" || prev === "dial") type = "dial";
    else if (prev === "blank" && next !== "" &&
             (t.startsWith("@") || CHAR_LATIN_RE.test(t) ||
              (HAS_CJK_RE.test(t) && t.length <= 8 && !SENTENCE_END_RE.test(t)))) type = "char";
    else type = "action";
    types.push(type);
  }
  return types;
}

const SCRIPT_CLASS = { blank: "blank", scene: "sc-scene", trans: "sc-trans",
                       paren: "sc-paren", dial: "sc-dial", char: "sc-char", action: "sc-action" };
const SCRIPT_LINE_PX = 24;                              // 必须与 CSS --sc-lh 一致
const SCRIPT_PAGE_PX = SCRIPT_LINE_PX * LINES_PER_PAGE; // 一页 = 55 行的实际像素高度

// 直接量实际排版高度来数页，与稿纸上画的分页线用同一套几何，保证「约X页」= 眼睛看到的页数
function updatePageInfo() {
  const gridTop = SCRIPT_LINE_PX * 2;  // 分页线起点（对应顶部留白）
  // 批注不是剧本内容，量高度前先藏起来，否则会把页数撑大
  const notes = editor.querySelectorAll(".note");
  notes.forEach((n) => (n.style.display = "none"));
  let bottom = gridTop;
  editor.childNodes.forEach((node) => {
    if (node.nodeType !== Node.ELEMENT_NODE || isNote(node)) return;
    const b = node.offsetTop + node.offsetHeight;
    if (b > bottom) bottom = b;
  });
  notes.forEach((n) => (n.style.display = ""));
  const pages = Math.max(1, Math.ceil((bottom - gridTop) / SCRIPT_PAGE_PX));
  $("pageCount").textContent = pages;
  $("minCount").textContent = pages;
}

/* ===== 逐行渲染编辑器 ===== */
function classify(text) {
  if (/^---+\s*$/.test(text)) return "rule";
  if (/^#\s/.test(text)) return "h1";
  if (/^#{2,}\s/.test(text)) return "h2";
  if (text.trim() === "") return "blank";
  return "";
}

function setEditorContent(text) {
  editor.innerHTML = "";
  const frag = document.createDocumentFragment();
  text.split("\n").forEach((lineText) => {
    const m = lineText.match(NOTE_RE);
    if (m) { frag.appendChild(buildMyNote(m[1], noteDecode(m[2]))); return; }
    const div = document.createElement("div");
    div.className = ("line " + classify(lineText)).trim();
    if (lineText === "") div.appendChild(document.createElement("br"));
    else div.textContent = lineText;
    frag.appendChild(div);
  });
  if (!text) {
    const div = document.createElement("div");
    div.className = "line blank";
    div.appendChild(document.createElement("br"));
    frag.appendChild(div);
  }
  editor.appendChild(frag);
}

/* ===== 批注的文件格式 =====
   批注就写在正文里，形如：
     <!-- 批注 2026-09-10 14:32 | 这里节奏太快 -->
   紧跟在被批注的段落之后——**位置就是锚点**，改段落文字也不会丢。
   Markdown 渲染时不显示；写作字数统计会跳过（前端 counts / 后端 count_text 都剥掉）。 */
const NOTE_RE = /^\s*<!--\s*批注\s*(.*?)\s*\|\s*([\s\S]*?)\s*-->\s*$/;

function noteEncode(t) {
  return t.replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/-->/g, "--\\>");
}
function noteDecode(t) {
  return t.replace(/\\(n|\\|>)/g, (m, c) => (c === "n" ? "\n" : c === "\\" ? "\\" : ">"));
}
function noteLine(stamp, text) {
  return `<!-- 批注 ${stamp} | ${noteEncode(text)} -->`;
}
function noteStamp(d) {
  const p = (x) => String(x).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function isNote(node) {
  return node.nodeType === Node.ELEMENT_NODE && node.classList.contains("note");
}

function getEditorContent() {
  const lines = [];
  editor.childNodes.forEach((node) => {
    if (isNote(node)) {
      // 自己的批注写进文件（HTML 注释）；朋友的留言不属于稿件，跳过
      if (node.classList.contains("my-note")) {
        const t = node.querySelector(".in-text");
        const body = t ? t.innerText.trim() : "";
        if (body) lines.push(noteLine(node.dataset.stamp || "", body));
      }
      return;
    }
    if (node.nodeType === Node.TEXT_NODE) lines.push(node.textContent);
    else lines.push(node.textContent.replace(/\n/g, ""));
  });
  return lines.join("\n");
}

function reclassify() {
  const nodes = Array.prototype.filter.call(editor.childNodes,
    (n) => n.nodeType === Node.ELEMENT_NODE && !isNote(n));
  const script = isScriptMode();
  let types = null;
  let lines = null;
  if (script) {
    lines = nodes.map((n) => n.textContent);
    types = classifyScriptLines(lines);
  }
  nodes.forEach((node, i) => {
    const kind = script ? SCRIPT_CLASS[types[i]] : classify(node.textContent);
    const cls = ("line " + kind).trim();
    const keepDim = node.classList.contains("dim") ? " dim" : "";
    if (node.className !== cls + keepDim) node.className = cls + keepDim;
  });
  if (script) updatePageInfo();
}

editor.addEventListener("paste", (e) => {
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData("text/plain");
  document.execCommand("insertText", false, text);

/* ===== 专注模式 ===== */
function applyFocus() {
  if (!prefs.focus) return;
  const sel = document.getSelection();
  let block = null;
  if (sel && sel.anchorNode && editor.contains(sel.anchorNode) && document.activeElement === editor) {
    let n = sel.anchorNode;
    while (n && n.parentNode !== editor) n = n.parentNode;
    block = n;
  }
  editor.childNodes.forEach((node) => {
    if (node.nodeType !== Node.ELEMENT_NODE) return;
    node.classList.toggle("dim", !!block && node !== block);
  });
}

  editor.querySelectorAll(".line.dim").forEach((n) => n.classList.remove("dim")));

/* ===== 字数 / 状态 ===== */
/* ===== 批注完整性护栏 =====
   正文的唯一真源是 DOM（getEditorContent 从 DOM 序列化）。这意味着任何让
   节点从 DOM 消失的显示 bug，都会在下一次保存时变成**数据删除**——这个系统
   里没有纯粹的显示 bug。2026-09-10 就是这样丢了三条批注。
   这道闸不针对某一个 bug，它拦的是同一类还没发生的 bug：
   保存前数一遍批注，比上次落盘时少了、又抵不掉用户主动删除的次数，就中止。 */
let noteDeletes = 0;   // 用户主动删掉的批注数，save 时抵扣，成功后清零

function countNotes(text) {
  return text.split("\n").filter((l) => NOTE_RE.test(l)).length;
}

function stripNotes(text) {
  return text.split("\n").filter((l) => !NOTE_RE.test(l)).join("\n");
}

function counts(text) {
  const t = stripNotes(text);   // 批注不算写作字数
  return { cjk: (t.match(CJK_RE) || []).length, en: (t.match(EN_RE) || []).length };
}


function renderCounts() {
  const c = counts(getEditorContent());
  $("cjkCount").textContent = c.cjk.toLocaleString();
  $("enCount").textContent = c.en.toLocaleString();
  renderActiveClock();
}

function setSync(text, cls) {

  $("syncDot").className = "sync-dot " + (cls || "");
}

function setTodayDelta(delta) {

}

function trackTyping() {
  // 只标记「正在打字」；时长由每秒的 tickActive 累计，避免双重计数
  lastKeyTs = Date.now();
}

function isTypingNow() {
  return lastKeyTs && Date.now() - lastKeyTs <= TYPING_IDLE_MS;
}

function tickActive() {
  if (isTypingNow()) {
    pendingActiveMs += 1000;
    localStorage.setItem("writing_pending_active", String(pendingActiveMs));
  }
  renderActiveClock();
}

function renderActiveClock() {
  const totalSec = Math.floor((serverActiveMs + pendingActiveMs) / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const p = (n) => String(n).padStart(2, "0");
  $("activeClock").textContent = h > 0 ? `${p(h)}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
  $("activeClock").classList.toggle("running", isTypingNow());
}

function localDate() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

/* ===== 同步 ===== */
async function api(path, payload) {

/* ===== 书架：子文件夹 = 一本书，根目录 = 主书架 ===== */
let currentBook = localStorage.getItem("writing_book") || "";

function bookOf(name) {
  const i = name.indexOf("/");
  return i < 0 ? "" : name.slice(0, i);
}

function fileLabel(name) {
  const i = name.indexOf("/");
  return i < 0 ? name : name.slice(i + 1);
}

function bookLabel(book) {
  return book === "" ? "主书架 · THE ROOM" : book;
}

function renderSelect() {
  const sel = $("docSelect");
  sel.innerHTML = "";
  bookDocs().forEach((d) => {
    const opt = document.createElement("option");
    opt.value = d.name;
    opt.textContent = fileLabel(d.name) + (d.readonly ? "（只读）" : "");

/* ===== 上一章 / 下一章：只在当前这本书里前后翻，顺序与下拉一致 ===== */
function bookDocs() {
  return docList.filter((d) => bookOf(d.name) === currentBook);
}

function siblingDoc(delta) {
  if (!current) return null;
  const list = bookDocs();
  const i = list.findIndex((d) => d.name === current.name);
  if (i < 0) return null;
  return list[i + delta] || null;
}

function renderChapNav() {
  [["prevDoc", -1, "上一章"], ["nextDoc", 1, "下一章"]].forEach(([id, delta, label]) => {
    const btn = $(id);
    if (!btn) return;
    const target = siblingDoc(delta);
    btn.disabled = !target;
    btn.title = target ? `${label}：${fileLabel(target.name)}` : `没有${label}了`;
  });
}

async function gotoSibling(delta) {
  const target = siblingDoc(delta);
  if (target) await openDoc(target.name);
}

/* ===== 3D 星空（Hail Mary 风格：真实银河底图 + 透视星点 + 鼠标视差） ===== */
const cosmos = { raf: null, stars: null, ry: 0, rx: 0, tx: 0, ty: 0 };

function initStars() {
  cosmos.stars = [];
  for (let i = 0; i < 420; i++) {
    // 球壳内随机分布
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    const r = 0.45 + Math.random() * 0.55;
    cosmos.stars.push({
      x: r * Math.sin(ph) * Math.cos(th),
      y: r * Math.cos(ph) * 0.6,
      z: r * Math.sin(ph) * Math.sin(th),
      size: Math.random() < 0.06 ? 1.8 + Math.random() * 1.4 : 0.5 + Math.random() * 0.9,
      gold: Math.random() < 0.12,
      tw: Math.random() * Math.PI * 2,
    });
  }
}

function drawStars(t) {
  const canvas = $("starCanvas");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  // 缓慢自转 + 鼠标视差偏转
  cosmos.ry += 0.00045;
  const ry = cosmos.ry + cosmos.tx * 0.35;
  const rx = cosmos.ty * 0.22;
  const cy = Math.cos(ry), sy = Math.sin(ry);
  const cx = Math.cos(rx), sx = Math.sin(rx);
  const f = Math.min(w, h) * 0.9;

  for (const s of cosmos.stars) {
    // 绕 Y 轴再绕 X 轴
    let x = s.x * cy + s.z * sy;
    let z = -s.x * sy + s.z * cy;
    let y = s.y * cx - z * sx;
    z = s.y * sx + z * cx;
    const depth = z + 1.6;
    if (depth < 0.25) continue;
    const px = w / 2 + (x / depth) * f;
    const py = h / 2 + (y / depth) * f;
    if (px < -10 || px > w + 10 || py < -10 || py > h + 10) continue;
    const tw = 0.65 + 0.35 * Math.sin(t / 900 + s.tw);
    const size = (s.size / depth) * 1.5;
    ctx.globalAlpha = Math.min(1, tw * (1.7 - depth * 0.55));
    ctx.fillStyle = s.gold ? "#d3b25c" : "#e8eef5";
    ctx.beginPath();
    ctx.arc(px, py, size, 0, Math.PI * 2);
    ctx.fill();
    if (s.size > 1.7) {  // 亮星：十字衍射芒
      ctx.globalAlpha *= 0.35;
      ctx.fillRect(px - size * 4, py - 0.4, size * 8, 0.8);
      ctx.fillRect(px - 0.4, py - size * 4, 0.8, size * 8);
    }
  }
  ctx.globalAlpha = 1;
  cosmos.raf = requestAnimationFrame(drawStars);
}

function startCosmos() {
  if (!cosmos.stars) initStars();
  if (!cosmos.raf) cosmos.raf = requestAnimationFrame(drawStars);
}

function stopCosmos() {
  if (cosmos.raf) cancelAnimationFrame(cosmos.raf);
  cosmos.raf = null;
}

document.addEventListener("mousemove", (e) => {
  if (!$("shelfView").classList.contains("open")) return;
  cosmos.tx = (e.clientX / window.innerWidth - 0.5);
  cosmos.ty = (e.clientY / window.innerHeight - 0.5);
  $("shelfBg").style.transform =
    `scale(1.06) translate(${-cosmos.tx * 14}px, ${-cosmos.ty * 10}px)`;
});

async function openShelf() {
  if (dirty) await save();
  renderShelfView();
  $("shelfView").classList.add("open");
  startCosmos();
  try { await loadList(); renderShelfView(); } catch (e) { /* 用缓存渲染 */ }
}

function timeAgo(ms) {
  if (!ms) return "";
  const d = Math.floor((Date.now() - ms) / 1000);
  if (d < 90) return "刚刚";
  if (d < 3600) return `${Math.floor(d / 60)} 分钟前`;
  if (d < 86400) return `${Math.floor(d / 3600)} 小时前`;
  if (d < 86400 * 30) return `${Math.floor(d / 86400)} 天前`;
  const t = new Date(ms);
  return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
}

function renderShelfView() {
  const grid = $("shelfGrid");
  grid.innerHTML = "";
  const books = new Map();  // book → {count, cjk, en, updatedAt}
  docList.forEach((d) => {
    const b = bookOf(d.name);
    const s = books.get(b) || { count: 0, cjk: 0, en: 0, updatedAt: 0 };
    s.count += 1;
    s.cjk += d.cjk || 0;
    s.en += d.en || 0;
    s.updatedAt = Math.max(s.updatedAt, d.updatedAt || 0);
    books.set(b, s);
  });
  // 空书架不占位。此前根书架即使 0 篇也强行画一张卡，永远显示「0 篇 · 0 字」。
  const entries = Array.from(books.entries()).filter(([, s]) => s.count > 0);

  // 按最近编辑排序——书架因此能告诉你上次停在哪，而不是按字母排。
  entries.sort((a, b) => b[1].updatedAt - a[1].updatedAt);
  const latest = entries.length ? entries[0][0] : null;

  const totalWords = entries.reduce((n, [, s]) => n + s.cjk + s.en, 0);
  $("shelfSub").textContent = entries.length
    ? `${entries.length} 本 · ${totalWords.toLocaleString()} 字`
    : "";

  entries.forEach(([book, s]) => {
    const words = s.cjk + s.en;
    const card = document.createElement("div");
    card.className = "book-card" + (book === latest ? " current" : "");

    const name = document.createElement("div");
    name.className = "bc-name";
    name.textContent = bookLabel(book);

    const meta = document.createElement("div");
    meta.className = "bc-meta";
    meta.textContent = `${s.count} 篇 · ${words.toLocaleString()} 字`;

    const when = document.createElement("div");
    when.className = "bc-when";
    when.textContent = s.updatedAt ? `最后编辑 · ${timeAgo(s.updatedAt)}` : "";

    const addChap = document.createElement("button");
    addChap.className = "bc-addchap";
    addChap.textContent = "＋ 新章节";
    addChap.title = `在「${bookLabel(book)}」里新建一章`;
    addChap.onclick = (e) => { e.stopPropagation(); newDoc(book); };

    if (book === latest) {
      const tag = document.createElement("span");
      tag.className = "bc-tag";
      tag.textContent = "在写";
      card.appendChild(tag);
    }
    card.appendChild(name);
    card.appendChild(meta);
    card.appendChild(when);
    card.appendChild(addChap);
    card.onclick = () => switchBook(book);
    grid.appendChild(card);
  });

  const add = document.createElement("div");
  add.className = "book-card new";
  add.textContent = "＋ 开一本新书";
  add.onclick = newBook;
  grid.appendChild(add);
}

async function switchBook(book) {
  currentBook = book;
  localStorage.setItem("writing_book", book);
  $("shelfView").classList.remove("open");
  renderSelect();
  const lastDocs = JSON.parse(localStorage.getItem("writing_last_docs") || "{}");
  const remembered = docList.find((d) => d.name === lastDocs[book]);
  const first = remembered ||
                docList.find((d) => bookOf(d.name) === book && !d.readonly) ||
                docList.find((d) => bookOf(d.name) === book);
  if (first) await openDoc(first.name);
  else setSync(`「${bookLabel(book)}」还没有文稿，点「新建」开始写`, "");
}

async function newBook() {
  const book = (window.prompt("新书的名字（会在你的写作文件夹里创建同名子文件夹）", "") || "").trim();
  if (!book) return;
  if (/[/\\]/.test(book) || book.startsWith(".")) {
    setSync("书名不能包含斜杠或以点开头", "err");
    return;
  }
  let file = (window.prompt("第一篇的文件名", "第一章") || "").trim();
  if (!file) return;
  if (!/\.(md|txt)$/i.test(file)) file += ".md";
  const name = `${book}/${file}`;
  const data = await api("/writing/docs/put", {
    name, content: "", editor: "web", date: localDate(), baseUpdatedAt: null,
  });
  if (!data.ok) {
    setSync(`新建失败：${data.error}`, "err");
    return;
  }
  currentBook = book;
  localStorage.setItem("writing_book", book);
  await loadList();
  await openDoc(name);
  setSync(`新书「${book}」已开——同名文件夹稍后会出现在你的电脑里`, "ok");
}

async function loadList() {
  const data = await api("/writing/docs/list", { date: localDate() });
  if (!data.ok) throw new Error(data.error);
  docList = data.docs;
  if (data.today) {
    serverActiveMs = data.today.activeMs || 0;
    setTodayDelta(data.today.deltaCjk);
  }
  renderCounts();
  renderSelect();
  if (docList.length === 0) setSync("等待电脑首次同步，或点「新建」直接开写", "");
}

async function openDoc(name) {
  if (dirty) await save();
  const data = await api("/writing/docs/get", { name });
  if (!data.ok) {
    setSync(`打开失败：${data.error}`, "err");
    return;
  }
  current = { name, updatedAt: data.updatedAt, readonly: data.readonly,
              baseContent: data.content, marks: data.marks || [],
              highlights: data.highlights || [] };
  noteDeletes = 0;
  currentBook = bookOf(name);
  localStorage.setItem("writing_book", currentBook);
  localStorage.setItem("writing_last_doc", name);
  const lastDocs = JSON.parse(localStorage.getItem("writing_last_docs") || "{}");
  lastDocs[currentBook] = name;
  localStorage.setItem("writing_last_docs", JSON.stringify(lastDocs));
  $("shelfView").classList.remove("open");
  stopCosmos();
  setEditorContent(data.content);
  editor.contentEditable = data.readonly ? "false" : "true";
  applyMode();
  reclassify();
  applyMarks();
  renderHighlights();
  if (pruneHighlights()) { renderHighlights(); persistHighlights(); }  // 清理已被改动的段落上的失效高亮
  renderCounts();
  renderSelect();
  setSync(data.readonly ? "只读（Word 文档请在电脑上编辑）" : "已就绪", "ok");
  loadComments(name);
}

/* ===== 作者自己的批注（鎏金，写进正文的 HTML 注释里；位置即锚点） ===== */
function buildMyNote(stamp, text) {
  const div = document.createElement("div");
  div.className = "note my-note";
  div.contentEditable = "false";          // 外壳不可编辑，只有 .in-text 是编辑岛
  div.dataset.stamp = stamp || noteStamp(new Date());
  div.innerHTML = `<span class="in-head">批注 · ${escapeHtml(div.dataset.stamp)}</span>
    <span class="in-del" title="删除这条批注">×</span>
    <div class="in-text"></div>`;

  const txt = div.querySelector(".in-text");
  txt.textContent = text || "";
  txt.contentEditable = "true";

  // 批注是正文的一部分，所以输入照常走编辑器那条流水线（标脏 + 防抖保存 +
  // 重新计数）。reclassify / applyMarks 都会跳过 isNote 节点，不会打架。
  txt.addEventListener("keydown", (e) => {
    e.stopPropagation();                  // 别让 ⌘/ ⌘M 在批注里误触发
    if (e.key === "Escape") txt.blur();
  });
  txt.addEventListener("blur", () => {
    if (!txt.innerText.trim()) {          // 空批注不留
      if (text) noteDeletes++;            // 原本有内容，算一次主动删除
      div.remove();
      dirty = true;
      save();
    }
  });

  div.querySelector(".in-del").onclick = () => {
    noteDeletes++;
    div.remove();
    dirty = true;
    renderCounts();
    save();
  };
  return div;
}

function addNote() {
  if (!current) return;
  if (current.readonly) { setSync("只读文件不能加批注", "err"); return; }
  const block = caretBlock();
  if (!block) { setSync("先把光标放到要批注的段落里", ""); return; }
  const div = buildMyNote(noteStamp(new Date()), "");
  block.after(div);
  const txt = div.querySelector(".in-text");
  txt.focus();
  dirty = true;
  setSync("编辑中…", "busy");
}

/* ===== 朋友的留言（编辑器内联展示，冷蓝色，作者可删） ===== */
async function loadComments(name) {
  // 正向选择 .friend-note：这个类名本身就不可能命中作者批注。
  // 曾经这里写的是「清空所有 .inline-note」——两种来源共用一个类名，
  // 于是把刚从正文解析出来的批注也删了，再一保存就从文件里永久消失。
  document.querySelectorAll(".friend-note").forEach((n) => n.remove());
  try {
    const data = await api("/writing/comments/mine", { name });
    if (!data.ok || !data.comments.length) return;
    const byPara = {};
    data.comments.forEach((c) => { if (c.para) (byPara[c.para] = byPara[c.para] || []).push(c); });
    editor.childNodes.forEach((node) => {
      if (node.nodeType !== Node.ELEMENT_NODE) return;
      const list = byPara[node.textContent.trim()];
      if (!list) return;
      list.forEach((c) => node.after(buildInlineNote(c)));
    });
  } catch (e) { /* 留言加载失败不影响写作 */ }
}

function buildInlineNote(c) {
  const div = document.createElement("div");
  div.className = "note friend-note";
  div.contentEditable = "false";
  const d = new Date(c.createdAt);
  const p = (n) => String(n).padStart(2, "0");
  div.innerHTML = `<span class="in-head">${escapeHtml(c.author)} · ${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}</span>
    <span class="in-del" title="删除这条留言">×</span>
    <div class="in-text"></div>`;
  div.querySelector(".in-text").textContent = c.text;
  div.querySelector(".in-del").onclick = async () => {
    div.remove();
    try { await api("/writing/comments/delete", { id: c.id }); } catch (e) {}
  };
  return div;
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
}

/* ===== 彩色高亮：选中文字上色（存储与正文分离，不污染 .md） ===== */
const HL_COLORS = ["red", "amber", "green", "cyan", "violet"];

// 把存储的高亮渲染进段落（重建 innerHTML，只对非当前光标所在段安全调用）
function renderHighlights() {
  if (!current) return;
  const byPara = {};
  (current.highlights || []).forEach((h) => (byPara[h.para] = byPara[h.para] || []).push(h));
  editor.childNodes.forEach((node) => {
    if (node.nodeType !== Node.ELEMENT_NODE || isNote(node)) return;
    const text = node.textContent;
    const hls = (byPara[text] || [])
      .filter((h) => HL_COLORS.includes(h.color) && h.len > 0 && h.start >= 0 && h.start + h.len <= text.length)
      .sort((a, b) => a.start - b.start);
    if (hls.length === 0) {
      if (node.querySelector && node.querySelector(".hl")) node.textContent = text; // 清掉残留 span
      return;
    }
    let html = "", pos = 0;
    hls.forEach((h) => {
      if (h.start < pos) return;  // 跳过重叠
      html += escapeHtml(text.slice(pos, h.start));
      html += `<span class="hl hl-${h.color}">${escapeHtml(text.slice(h.start, h.start + h.len))}</span>`;
      pos = h.start + h.len;
    });
    html += escapeHtml(text.slice(pos));
    node.innerHTML = html;
  });
}

// 从当前选区解析出 {block, para, start, len}；跨段或无选区返回 null
/** 选区拆成「每段一条」。跨段选中时返回多条——高亮按段落原文锚定，
    一条记录只能描述一个段落内的区间，所以跨段必须切开存。 */
function selectionSpans() {
  const sel = document.getSelection();
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return [];
  const range = sel.getRangeAt(0);
  const blockOf = (n) => { while (n && n.parentNode !== editor) n = n.parentNode; return n; };
  const first = blockOf(range.startContainer);
  const last = blockOf(range.endContainer);
  if (!first || !last) return [];

  const out = [];
  for (const block of editor.children) {
    if (isNote(block) || !range.intersectsNode(block)) continue;
    const text = block.textContent;
    if (!text) continue;
    // 该段落与选区的交集：首段从选区起点开始，末段到选区终点为止，中间整段
    let start = 0, end = text.length;
    if (block === first) {
      const pre = document.createRange();
      pre.selectNodeContents(block);
      pre.setEnd(range.startContainer, range.startOffset);
      start = pre.toString().length;
    }
    if (block === last) {
      const pre = document.createRange();
      pre.selectNodeContents(block);
      pre.setEnd(range.endContainer, range.endOffset);
      end = pre.toString().length;
    }
    if (end > start) out.push({ block, para: text, start, len: end - start });
  }
  return out;
}

function showPalette() {
  const pal = $("hlPalette");
  if (selectionSpans().length === 0 || editor.contentEditable === "false") {
    pal.classList.remove("open"); return;
  }
  const rect = document.getSelection().getRangeAt(0).getBoundingClientRect();
  pal.style.left = (rect.left + rect.width / 2) + "px";
  pal.style.top = (rect.top - 8) + "px";
  pal.classList.add("open");
}

function persistHighlights() {
  api("/writing/docs/highlights", { name: current.name, highlights: current.highlights })
    .catch(() => setSync("高亮保存失败，稍后自动重试", "err"));
}

function applyHighlight(color) {
  const spans = selectionSpans();
  $("hlPalette").classList.remove("open");
  if (spans.length === 0 || !current) return;
  current.highlights = current.highlights || [];

  spans.forEach((span) => {
    const a = span.start, b = span.start + span.len;
    if (color === "clear") {
      // 移除与选区重叠的、同段高亮
      current.highlights = current.highlights.filter((h) =>
        !(h.para === span.para && h.start < b && h.start + h.len > a));
    } else {
      // 先去掉同段完全被覆盖的旧高亮，再加新的
      current.highlights = current.highlights.filter((h) =>
        !(h.para === span.para && h.start >= a && h.start + h.len <= b));
      current.highlights.push({ para: span.para, start: span.start, len: span.len, color });
    }
  });

  document.getSelection().removeAllRanges();
  renderHighlights();
  persistHighlights();
  const n = spans.length > 1 ? `${spans.length} 段` : "";
  setSync(color === "clear" ? `已清除高亮${n}` : `已高亮${n}`, "ok");
}

// 编辑后清理锚定失效（段落被改动）的高亮
function pruneHighlights() {
  if (!current || !current.highlights || current.highlights.length === 0) return false;
  const paras = new Set();
  editor.childNodes.forEach((n) => { if (n.nodeType === Node.ELEMENT_NODE && !isNote(n)) paras.add(n.textContent); });
  const before = current.highlights.length;
  current.highlights = current.highlights.filter((h) => paras.has(h.para));
  return current.highlights.length !== before;
}

$("hlPalette").addEventListener("mousedown", (e) => {
  const el = e.target.closest("[data-c]");
  if (el) { e.preventDefault(); applyHighlight(el.dataset.c); }
});
document.addEventListener("selectionchange", () => {
  if (document.activeElement === editor) setTimeout(showPalette, 0);
  else $("hlPalette").classList.remove("open");
});

async function shareBook() {
  if (!current) { setSync("先打开一本书", ""); return; }
  const label = bookLabel(currentBook);
  try {
    const data = await api("/writing/share/create", { book: currentBook });
    if (!data.ok) { setSync(`分享失败：${data.error}`, "err"); return; }
    const url = `${location.origin}/read?s=${data.shareId}`;
    try { await navigator.clipboard.writeText(url); } catch (e) {}
    window.prompt(`「${label}」的只读分享链接已复制。\n朋友打开可读整本书、能对段落留言（不能编辑，也看不到你其他的书）。\n她的留言会以冷蓝色显示在你的编辑器里。`, url);
  } catch (e) {
    setSync(`分享失败：${e.message}`, "err");
  }
}

editor.addEventListener("input", () => {
  dirty = true;
  trackTyping();
  rememberEditPos();
  reclassify();
  applyMarks();
  renderCounts();
  setSync("编辑中…", "busy");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, SAVE_DEBOUNCE_MS);
});

async function save() {
  if (!current || current.readonly || !dirty) return;
  const content = getEditorContent();

  const was = countNotes(current.baseContent || "");
  const now = countNotes(content);
  if (now < was - noteDeletes) {
    // 没经过删除按钮，批注却变少了 —— 只可能是渲染或 DOM 操作出了问题。
    // 宁可不保存：磁盘上那份是完好的，重新打开就能拿回来。
    setSync(`已中止保存：批注从 ${was} 条变成 ${now} 条，且未经删除操作。请重新打开本篇`, "err");
    console.error("[批注护栏] 中止保存", { was, now, noteDeletes, name: current.name });
    return;
  }
  try {
    const sentActiveMs = Math.round(pendingActiveMs);
    const data = await api("/writing/docs/put", {
      name: current.name, content, editor: "web",
      date: localDate(), baseUpdatedAt: current.updatedAt,
      activeMs: sentActiveMs,
    });
    if (data.ok) {
      dirty = false;
      current.baseContent = content;   // 护栏基线
      noteDeletes = 0;
      current.updatedAt = data.updatedAt;
      serverActiveMs = data.activeMs || 0;
      pendingActiveMs = Math.max(0, pendingActiveMs - sentActiveMs);
      localStorage.setItem("writing_pending_active", String(pendingActiveMs));
      renderCounts();
      setTodayDelta(data.deltaCjk);
      const t = new Date();
      const p = (n) => String(n).padStart(2, "0");
      setSync(`已同步 ${p(t.getHours())}:${p(t.getMinutes())}`, "ok");
    } else if (data.conflict) {
      localStorage.setItem("writing_conflict_backup", content);
      setSync("电脑上有更新的版本，已重新加载（你的改动暂存在本机）", "err");
      dirty = false;
      await openDoc(current.name);
    } else {
      throw new Error(data.error || "未知错误");
    }
  } catch (e) {
    setSync(`同步失败：${e.message}（8 秒后重试）`, "err");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 8000);
  }
}

async function newDoc(book) {
  const target = book === undefined ? currentBook : book;
  let file = (window.prompt(`在「${bookLabel(target)}」里新建一章（会同步到你的电脑文件夹）`, "新篇章") || "").trim();
  if (!file) return;
  if (!/\.(md|txt)$/i.test(file)) file += ".md";
  const name = target ? `${target}/${file}` : file;
  const data = await api("/writing/docs/put", {
    name, content: "", editor: "web", date: localDate(), baseUpdatedAt: null,
  });
  if (!data.ok) {
    setSync(`新建失败：${data.error}`, "err");
    return;
  }
  currentBook = target;
  localStorage.setItem("writing_book", target);
  await loadList();
  await openDoc(name);
}

function copyDoc() {
  navigator.clipboard.writeText(getEditorContent()).then(
    () => setSync("已复制全文", "ok"),
    () => setSync("复制失败", "err")
  );
}

function editToken() {
  $("tokenInput").value = token;
  $("setup").classList.remove("hidden");
}

async function saveToken() {
  const v = $("tokenInput").value.trim();
  if (!v) return;
  token = v;
  localStorage.setItem("writing_token", v);
  $("setup").classList.add("hidden");
  await boot();
}

async function refresh() {
  // 正在写批注时不要后台重载：批注编辑不置 dirty，重载会重建 DOM 冲掉没存完的字
  const inNote = document.activeElement && document.activeElement.closest &&
                 document.activeElement.closest(".note");
  if (!token || dirty || inNote) return;
  try {
    await loadList();
    if (current) {
      const meta = docList.find((d) => d.name === current.name);
      if (meta && meta.updatedAt > current.updatedAt) await openDoc(current.name);
    }
  } catch (e) { /* 下轮再试 */ }
}

async function boot() {
  try {
    await loadList();
    // 回到上次写的地方。writing_last_doc 每次 openDoc 都在写，
    // 此前启动时从不读它，于是刷新一律回书架。
    const last = localStorage.getItem("writing_last_doc");
    if (last && docList.some((d) => d.name === last)) {
      await openDoc(last);
      jumpToLastEdit();   // 光标也回到上次落笔处（lastEditPos 本就存在 localStorage）
      return;
    }
    renderShelfView();
    $("shelfView").classList.add("open");
    startCosmos();
    setSync("从书架上取一本开始", "");
  } catch (e) {
    setSync(`连接失败：${e.message}`, "err");
  }
}

/* ===== 启动 ===== */
applyPrefs();
renderActiveClock();
setInterval(tickActive, 1000);
if (token) {
  $("setup").classList.add("hidden");
  boot();
}
setInterval(refresh, REFRESH_MS);
setInterval(renderCounts, 30000);
window.addEventListener("beforeunload", () => { if (dirty) save(); });

/* ===== 科幻顾问 ===== */
let advisorBusy = false;
let advisorLastSel = "";

/* 记住编辑器里最后一次非空选区——点面板按钮时正文选区可能已失焦 */
document.addEventListener("selectionchange", () => {
  const sel = document.getSelection();
  if (!sel || sel.isCollapsed) return;
  const anchor = sel.anchorNode;
  if (anchor && $("editor").contains(anchor.nodeType === 1 ? anchor : anchor.parentNode)) {
    advisorLastSel = sel.toString().trim();
  }
});

function advisorBookLabel() {
  if (!current) return "";
  return bookOf(current.name) || "根书架";
}

function toggleAdvisor() {
  const p = $("advisorPanel");
  const opening = !p.classList.contains("open");
  $("marksPanel").classList.remove("open");
  p.classList.toggle("open", opening);
  if (opening) {
    const b = advisorBookLabel();
    $("advisorHint").textContent = b
      ? `当前：《${b}》· 只读这本书的 00_ 设定。查冲突需先在正文里选中一段。`
      : "先打开一篇文档，顾问才知道你在哪本书里。";
    $("advisorQ").focus();
  }
}

function closeAdvisor() {
  $("advisorPanel").classList.remove("open");
}

/* 极简 markdown → HTML，只处理顾问会输出的三种标记 */
function advisorRender(text) {
  const esc = text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
  return esc
    .replace(/^#{2,3} +(.+)$/gm, "<h3>$1</h3>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}

async function runAdvisor(mode) {
  if (advisorBusy) return;

  const out = $("advisorOut");
  const question = $("advisorQ").value.trim();
  const live = document.getSelection().toString().trim();
  const selection = live || advisorLastSel;

  if (!current) {
    out.innerHTML = '<span class="ad-err">先打开一篇文档，顾问才知道你在哪本书里。</span>';
    return;
  }
  if (mode === "ask" && !question) {
    out.innerHTML = '<span class="ad-err">先写一个问题。</span>';
    return;
  }
  if (mode === "check" && !selection) {
    out.innerHTML = '<span class="ad-err">查冲突需要先在正文里选中一段文字。</span>';
    return;
  }

  advisorBusy = true;
  $("advisorAsk").disabled = true;
  $("advisorCheck").disabled = true;
  out.innerHTML = '<span class="ad-wait">' +
    (mode === "ask" ? "顾问正在读设定…" : "正在逐条比对冲突清单…") +
    "（十几秒）</span>";

  try {
    const data = await api("/scifi-advisor", {
      mode,
      question,
      selection,
      name: current ? current.name : "",
    });
    if (!data.ok) {
      out.innerHTML = '<span class="ad-err">' + (data.error || "调用失败") + "</span>";
    } else {
      out.innerHTML = advisorRender(data.answer);
      $("advisorHint").textContent =
        `依据《${data.book}》· ${data.canon} · 人格：${data.persona}`;
    }
  } catch (e) {
    out.innerHTML = '<span class="ad-err">网络错误：' + e.message + "</span>";
  } finally {
    advisorBusy = false;
    $("advisorAsk").disabled = false;
    $("advisorCheck").disabled = false;
  }
}
